return `<p class="mu">共 ${D.length} 個成語，依主題分類。點開類別，再點成語看定義和造句。</p>`+names.map(n=>`<details class="cat"><summary>${n}（${CG[n].length}）</summary>${CG[n].map(w=>`<span class="chip">${w}</span>`).join("")}</details>`).join("")}
function fillQ(){cur=2;const k=Math.floor(Math.random()*D.length),w=D[k].w,len=Math.random()<.5?1:2,pos=Math.floor(Math.random()*(5-len)),ans=w.substr(pos,len),stem=w.slice(0,pos)+"＿".repeat(len)+w.slice(pos+len);
const all=new Set(D.map(x=>x.w)),o=new Set([ans]);let g=0;
while(o.size<4&&g++<800){const x=D[Math.floor(Math.random()*D.length)].w,c=x.substr(Math.floor(Math.random()*(5-len)),len);if(o.has(c)||all.has(w.slice(0,pos)+c+w.slice(pos+len)))continue;o.add(c)}
ask("成語填空",`請選出適合填入空格的字：<br><span class="big">${stem}</span><br><span class="mu">提示：${D[k].d}</span>`,k,"w",ans,sh([...o]))}
[0,1,2,3].forEach(i=>document.getElementById("t"+i).onclick=()=>tab(i));tab(0);
</script></body></html>
